name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Interclip/**'
      - 'InterclipShared/**'
      - 'InterclipUITests/**'
      - 'fastlane/Snapfile'

jobs:
  screenshots:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications/ | grep '^Xcode' | grep '\.app$' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: Remove simulators from older iOS runtimes
        run: |
          python3 - <<'EOF'
          import subprocess, json

          rts = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          ios = [r for r in rts if r.get('name', '').startswith('iOS') and r.get('isAvailable')]
          ios.sort(key=lambda r: list(map(int, r['version'].split('.'))))
          if len(ios) <= 1:
              print("Only one iOS runtime, nothing to remove")
              exit(0)

          keep = ios[-1]['identifier']
          print(f"Keeping: {ios[-1]['name']} ({keep})")

          devs = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', '--json']))['devices']
          for rt, sims in devs.items():
              if rt.startswith('com.apple.CoreSimulator.SimRuntime.iOS') and rt != keep:
                  for sim in sims:
                      subprocess.run(['xcrun', 'simctl', 'delete', sim['udid']], capture_output=True)
                  print(f"Cleaned: {rt}")
          EOF

      - name: Capture screenshots
        run: bundle exec fastlane snapshot

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: fastlane/screenshots
          retention-days: 30
