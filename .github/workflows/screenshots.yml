name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Interclip/**'
      - 'InterclipShared/**'
      - 'InterclipUITests/**'
      - 'fastlane/Snapfile'

jobs:
  screenshots:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Select Xcode
        run: |
          # Pick the latest Xcode available on this runner
          XCODE=$(ls /Applications/ | grep '^Xcode' | grep '\.app$' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep iPhone

      - name: Capture screenshots
        run: bundle exec fastlane snapshot

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: fastlane/screenshots
          retention-days: 30
